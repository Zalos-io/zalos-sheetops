name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package to PyPI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv sync --all-groups --locked
      - name: Install rtk shim
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/usr/bin/env bash\nexec "$@"\n' > "$HOME/.local/bin/rtk"
          chmod +x "$HOME/.local/bin/rtk"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: rtk uv run pytest
      - run: rtk uv run ruff check .
      - run: rtk uv run ruff format --check .
      - run: uv build --no-sources
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - run: uv publish --trusted-publishing always dist/*
