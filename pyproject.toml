[project]
name = "zalos-sheetops"
version = "0.4.6"
description = "Agent-native Excel and CSV operations toolkit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/zalos_sheetops/benchmarks/public/READBENCH-LICENSE"]
authors = [{name = "Zalos"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.0,<4",
]

[project.optional-dependencies]
bulk = ["fastexcel>=0.21,<1", "pyarrow>=25,<26"]

[project.urls]
Repository = "https://github.com/Zalos-io/zalos-sheetops"
Issues = "https://github.com/Zalos-io/zalos-sheetops/issues"

[project.scripts]
sheetops = "zalos_sheetops.cli:app"

[project.entry-points."hermes_agent.plugins"]
sheetops-delivery = "zalos_sheetops.hermes_plugin:register"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10",
    "ruff>=0.15.0,<0.17",
    "fastexcel>=0.21,<1",
    "pyarrow>=25,<26",
]

benchmark = [
    "polars>=1.38.1,<2",
    "XlsxWriter>=3.2,<4",
    "fastexcel>=0.21,<1",
    "python-calamine>=0.6,<1",
    "pyarrow>=25,<26",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zalos_sheetops"]

[tool.hatch.build.targets.sdist]
exclude = ["/benchmarks/results"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
